name: OpenRouter PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number for the isolated real-model canary"
        required: true
        type: number

permissions: {}

jobs:
  authorize:
    name: Authorize review request
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
      base_ref: ${{ steps.authorize.outputs.base_ref }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      pr_number: ${{ steps.authorize.outputs.pr_number }}
      reason: ${{ steps.authorize.outputs.reason }}
    steps:
      - name: Check event and pull request
        id: authorize
        env:
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          allowed=false
          base_ref=""
          head_sha=""
          pr_number=""
          reason="unsupported event"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${PR_DRAFT}" == "true" ]]; then
              reason="draft pull request"
            elif [[ "${PR_HEAD_REPOSITORY}" != "${REPOSITORY}" ]]; then
              reason="fork pull request"
            else
              allowed=true
              base_ref="${PR_BASE_REF}"
              head_sha="${PR_HEAD_SHA}"
              pr_number="${PR_NUMBER}"
              reason="eligible pull request event"
            fi
          elif [[ "${EVENT_NAME}" == "issue_comment" ]]; then
            if [[ "${COMMENT_BODY}" != "@junie-agent code-review" ]]; then
              reason="comment is not an exact review command"
            elif [[ ! "${COMMENT_ASSOCIATION}" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]]; then
              reason="comment author is not trusted"
            elif [[ -z "${ISSUE_NUMBER}" ]]; then
              reason="missing pull request number"
            else
              pr_json="$(gh api "repos/${REPOSITORY}/pulls/${ISSUE_NUMBER}" 2>/dev/null || true)"

              if [[ -z "${pr_json}" ]]; then
                reason="comment is not on a pull request"
              elif [[ "$(jq -r '.draft' <<<"${pr_json}")" == "true" ]]; then
                reason="draft pull request"
              elif [[ "$(jq -r '.head.repo.full_name' <<<"${pr_json}")" != "${REPOSITORY}" ]]; then
                reason="fork pull request"
              else
                allowed=true
                base_ref="$(jq -r '.base.ref' <<<"${pr_json}")"
                head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
                pr_number="${ISSUE_NUMBER}"
                reason="authorized manual review request"
              fi
            fi
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            pr_json="$(gh api "repos/${REPOSITORY}/pulls/${INPUT_PR_NUMBER}" 2>/dev/null || true)"

            if [[ -z "${pr_json}" ]]; then
              reason="canary pull request was not found"
            elif [[ "$(jq -r '.draft' <<<"${pr_json}")" == "true" ]]; then
              reason="draft pull request"
            elif [[ "$(jq -r '.head.repo.full_name' <<<"${pr_json}")" != "${REPOSITORY}" ]]; then
              reason="fork pull request"
            else
              allowed=true
              base_ref="$(jq -r '.base.ref' <<<"${pr_json}")"
              head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
              pr_number="${INPUT_PR_NUMBER}"
              reason="authorized isolated canary"
            fi
          fi

          echo "allowed=${allowed}" >> "${GITHUB_OUTPUT}"
          echo "base_ref=${base_ref}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          echo "Review authorization: ${allowed} (${reason})"

  review:
    name: Review pull request
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    concurrency:
      group: openrouter-pr-review-${{ needs.authorize.outputs.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Verify review secrets are configured
        env:
          APP_ID_CONFIGURED: ${{ secrets.OPENROUTER_REVIEW_APP_ID != '' }}
          APP_KEY_CONFIGURED: ${{ secrets.OPENROUTER_REVIEW_APP_PRIVATE_KEY != '' }}
          OPENROUTER_CONFIGURED: ${{ secrets.OPENROUTER_API_KEY != '' }}
        run: |
          set -euo pipefail
          [[ "${APP_ID_CONFIGURED}" == "true" ]] || { echo "::error::OPENROUTER_REVIEW_APP_ID is not configured"; exit 1; }
          [[ "${APP_KEY_CONFIGURED}" == "true" ]] || { echo "::error::OPENROUTER_REVIEW_APP_PRIVATE_KEY is not configured"; exit 1; }
          [[ "${OPENROUTER_CONFIGURED}" == "true" ]] || { echo "::error::OPENROUTER_API_KEY is not configured"; exit 1; }

      - name: Checkout trusted review tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: review-tools
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Checkout pull request for read-only review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: review-target
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.head_sha }}

      - name: Install Junie CLI
        run: |
          set -euo pipefail
          curl -fsSL https://junie.jetbrains.com/install.sh | JUNIE_VERSION=3013.5 bash
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Generate and validate review
        id: generate-review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_RESULT_FILE: ${{ runner.temp }}/openrouter-review/result.json
        run: |
          set -euo pipefail
          node "${GITHUB_WORKSPACE}/review-tools/scripts/openrouter-review/run-review.js" \
            --project "${GITHUB_WORKSPACE}/review-target" \
            --trusted-root "${GITHUB_WORKSPACE}/review-tools" \
            --base-ref "${{ needs.authorize.outputs.base_ref }}" \
            --head-sha "${{ needs.authorize.outputs.head_sha }}" \
            --result-file "${REVIEW_RESULT_FILE}"

      - name: Create short-lived review publisher token
        id: review-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPENROUTER_REVIEW_APP_ID }}
          private-key: ${{ secrets.OPENROUTER_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Publish validated review
        env:
          GH_TOKEN: ${{ steps.review-app-token.outputs.token }}
          REVIEW_RESULT_FILE: ${{ runner.temp }}/openrouter-review/result.json
        run: |
          set -euo pipefail
          node "${GITHUB_WORKSPACE}/review-tools/scripts/openrouter-review/publish-review.js" \
            --result-file "${REVIEW_RESULT_FILE}" \
            --repository "${GITHUB_REPOSITORY}" \
            --pull-number "${{ needs.authorize.outputs.pr_number }}" \
            --run-id "${GITHUB_RUN_ID}"

      - name: Clean up transient review data
        if: always()
        run: |
          set -euo pipefail
          find "${RUNNER_TEMP}" -maxdepth 1 -type d -name 'cat-tools-openrouter-review-*' -exec find {} -type f -delete \; 2>/dev/null || true
          find "${RUNNER_TEMP}" -maxdepth 1 -type d -name 'cat-tools-openrouter-review-*' -exec find {} -depth -type d -empty -delete \; 2>/dev/null || true
          find "${RUNNER_TEMP}/openrouter-review" -type f -delete 2>/dev/null || true
          find "${RUNNER_TEMP}/openrouter-review" -depth -type d -empty -delete 2>/dev/null || true
